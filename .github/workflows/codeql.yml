name: CodeQL

# Static analysis of WooSarr's own code (dependencies are covered by pip-audit, npm audit
# and Dependabot; the image by Trivy in docker-publish.yml). Findings appear under
# Security → Code scanning; on a pull request, new ones are shown on the PR.
#
# Python and TypeScript are interpreted, so nothing is built (build-mode: none). The
# workflows themselves are scanned too (actions). A weekly run catches new queries
# against unchanged code.

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# No token permissions unless a job asks for them.
permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (version in the comment), like the other workflows.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
