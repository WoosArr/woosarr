name: Docker publish

# Push to main or a version tag: run CI first, then build and publish the image
# to GHCR only if CI passes. Uses the built-in GITHUB_TOKEN; no stored registry
# credentials. Pull requests run CI only (see ci.yml).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build for the runner first and smoke-test it; only a passing image is pushed.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: woosarr:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (health, healthy status, /config persistence, graceful stop)
        run: scripts/smoke-test.sh woosarr:smoke 31337

      - name: Compose smoke test (compose.yaml starts the image and it becomes healthy)
        run: |
          conf="$RUNNER_TEMP/woosarr-compose-config"
          mkdir -p "$conf"
          export WOOSARR_IMAGE=woosarr:smoke WOOSARR_CONFIG="$conf" WOOSARR_HOST_PORT=31339
          docker compose -p woosarr-ci config -q
          docker compose -p woosarr-ci up -d --wait --wait-timeout 120 || { docker compose -p woosarr-ci logs; exit 1; }
          curl -fsS http://127.0.0.1:31339/api/health; echo
          sudo test -f "$conf/app.db"  # /config is owned by PUID (umask 027)
          docker compose -p woosarr-ci down

      - name: Scan image for secrets (fails) and vulnerabilities (report)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 "$@"; }
          trivy image --scanners secret --exit-code 1 --no-progress woosarr:smoke
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress woosarr:smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
