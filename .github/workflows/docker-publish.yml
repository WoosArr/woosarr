name: Docker publish

# Push to main or a version tag: run CI first, then build and publish the image
# to GHCR only if CI passes. Uses the built-in GITHUB_TOKEN; no stored registry
# credentials. Pull requests run CI only (see ci.yml).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Actions and tool images are pinned to commit SHAs / digests (version in the comment):
# a moved tag can't change what runs in a job that can publish images.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Build for the runner first and smoke-test it; only a passing image is pushed.
      - name: Build for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: woosarr:smoke
          # Separate cache scopes: one shared scope was overwritten by this amd64-only build,
          # so the multi-arch build below never found its arm64 layers (rebuilt under QEMU).
          cache-from: type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=smoke-amd64

      - name: Smoke test (health, healthy status, /config persistence, graceful stop)
        run: scripts/smoke-test.sh woosarr:smoke 31337

      - name: Compose smoke test (compose.yaml starts the image and it becomes healthy)
        run: |
          conf="$RUNNER_TEMP/woosarr-compose-config"
          mkdir -p "$conf"
          export WOOSARR_IMAGE=woosarr:smoke WOOSARR_CONFIG="$conf" WOOSARR_HOST_PORT=31339
          docker compose -p woosarr-ci config -q
          docker compose -p woosarr-ci up -d --wait --wait-timeout 120 || { docker compose -p woosarr-ci logs; exit 1; }
          curl -fsS http://127.0.0.1:31339/api/health; echo
          sudo test -f "$conf/app.db"  # /config is owned by PUID (umask 027)
          # Second start on the existing /config (owned by PUID): the dropped capabilities must still do.
          docker compose -p woosarr-ci restart
          docker compose -p woosarr-ci up -d --wait --wait-timeout 120 || { docker compose -p woosarr-ci logs; exit 1; }
          curl -fsS http://127.0.0.1:31339/api/health; echo
          docker compose -p woosarr-ci down

      - name: Scan image for secrets (fails) and vulnerabilities (report)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa "$@"; }
          trivy image --scanners secret --exit-code 1 --no-progress woosarr:smoke
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress woosarr:smoke

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=release-multiarch
            type=gha,scope=smoke-amd64
          cache-to: type=gha,mode=max,scope=release-multiarch
