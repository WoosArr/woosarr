[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "woosarr"
version = "0.1.0"
description = "Sync Plex library access from Discord roles"
requires-python = ">=3.12"
dependencies = [
  # Minimums are versions the test suite has run against (P10-05).
  "fastapi>=0.143",
  "starlette>=1.8",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "cryptography>=42",
  "argon2-cffi>=25.1",
  "PlexAPI>=4.18",
  "discord.py>=2.7",
  "aiohttp>=3.9",
  "requests>=2.31",
  "PyJWT[crypto]>=2.15",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["woosarr*"]

[tool.setuptools.package-data]
# Default Discord bot avatar (rendered by `make icons`).
woosarr = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic writes these; keep them as generated.
extend-exclude = ["woosarr/db/migrations/versions"]

[tool.ruff.lint.isort]
known-first-party = ["woosarr"]
